name: Turkish localization Android smoke build
on:
  push:
    branches:
      - ci/turkish-build-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build independently installable Turkish test APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out Turkish PR code
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Separate test package from existing installed ProPDA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f = Path('app/build.gradle')
          s = f.read_text()
          marker = '    buildTypes {\n        debug {'
          assert s.count(marker) == 1
          f.write_text(s.replace(marker, marker + "\n            applicationIdSuffix '.trtest'", 1))
          PY

      - name: Assemble Turkish test APK
        run: ./gradlew :app:assembleStableDebug -Pforpda.allowDebugSignedStable=true --no-daemon --stacktrace

      - name: Upload APK for phone QA
        uses: actions/upload-artifact@v4
        with:
          name: ProPDA-tr-test-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
